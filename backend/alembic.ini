# Alembic 配置（《开发手册》5.5 数据库迁移）
#
# 使用步骤（在 backend/ 目录下执行）：
#   alembic revision --autogenerate -m "init"
#   alembic upgrade head
#
# 说明：这里把 script_location 设为 migrations，迁移脚本放 backend/migrations/。
# 手册 5.5 的示例命令是 `alembic init migrations`，与本文件一致。

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
# sqlalchemy.url 由 migrations/env.py 从 app.core.config.settings.DATABASE_URL 注入，
# 因此不要把真实连接串写在这个文件里（也不要提交密钥，14.6）。
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
