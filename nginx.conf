# Nginx 反向代理（《开发手册》16.3：/api 反代到 app:8000，静态资源指向 frontend/dist；14.4 HTTPS）
#
# 使用方式：docker-compose.yml 把它挂到 /etc/nginx/nginx.conf
#
# 注意：
# 1. 手册未给 nginx.conf 原文，本文件按 16.3 的一句话要求展开；
# 2. SSE（7.2）必须关掉 proxy_buffering，否则流式回复会被 Nginx 攒着一起发；
# 3. HTTPS 段默认注释，证书放到 ./certs 后按 14.4 解开（Let's Encrypt）。

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" rt=$request_time';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens   off;

    # 13.2：简历上传最大 10MB，这里给到 12MB 留余量
    client_max_body_size 12m;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    upstream ai_career_backend {
        server app:8000;
        keepalive 32;
    }

    # ---------- HTTP：生产建议只做跳转 + ACME 校验 ----------
    server {
        listen       80;
        server_name  _;

        # 14.4 Let's Encrypt 校验目录（certbot --webroot 用）
        location /.well-known/acme-challenge/ {
            root /usr/share/nginx/html;
        }

        # 解开下面一段并注释掉本 server 里的其它 location，即可强制 HTTPS
        # return 301 https://$host$request_uri;

        # ---------- 静态前端（8.x 前端构建产物） ----------
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # ---------- 简历文件：刻意**不配**静态 location（安全修复）----------
        # 曾经有：
        #     location /uploads/ { alias /usr/share/nginx/uploads/; expires 7d; }
        # 那等于把 uploads 目录整体对外公开：任何人（未登录也行）遍历
        # /uploads/resumes/{user_id}/{uuid}.pdf 就能下载别人的简历（姓名/手机号/
        # 学校/经历 = PII），而 file_path 里就带 user_id，路径完全可枚举。
        # 违反手册 14.5「用户只能访问自己的数据」与 14.1「数据保密」。
        #
        # 现在简历文件**只能**走带鉴权的接口：
        #     GET /api/v1/resume/{resume_id}/file   （由下面 `location /api/` 代理到后端，
        #     后端校验 JWT + 归属 + 路径不越出 UPLOAD_DIR）
        # 所以这里不要加任何 /uploads 的 location；也不要再挂
        # /usr/share/nginx/uploads 卷（docker-compose.yml 里的对应挂载已移除）。

        # ---------- SSE 流式对话（7.2 + FIX 1/3）---------
        # POST（前端正式使用）与 GET（调试用）两个端点都命中本规则；
        # 正则匹配路径中任意位置的 /stream，末尾允许子路径，避免将来漏配后
        # 掉进下面的 `location /api/` 被按带缓冲处理。
        location ~ ^/api/v1/chat/conversations/[^/]+/stream(/|$) {
            proxy_pass         http://ai_career_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";

            # 流式必须关缓冲，否则事件会被 Nginx 攒着一起发
            proxy_buffering     off;
            proxy_cache         off;
            proxy_request_buffering off;   # POST 的 body 立即转发给后端
            proxy_read_timeout  300s;
            proxy_send_timeout  300s;
            chunked_transfer_encoding on;
            add_header X-Accel-Buffering no;
        }

        # ---------- API 反向代理（16.3 + FIX 3）---------
        location /api/ {
            proxy_pass         http://ai_career_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";

            proxy_connect_timeout 10s;
            proxy_read_timeout    120s;
            proxy_send_timeout    120s;

            # FIX 3：不要把上游的 4xx/5xx 改写成 200。
            # Nginx 的 proxy_intercept_errors 默认就是 off，这里显式写出来，
            # 防止后来有人加全局 error_page 时把 401/403/404 吞掉。
            proxy_intercept_errors off;

            # 给上游的错误响应补 CORS 头（直连时由 FastAPI 的 CORSMiddleware 负责，
            # 经 Nginx 代理时这里兜底，避免前端读到不透明的网络错误）
            add_header Access-Control-Allow-Origin      $http_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
        }

        # ---------- 接口文档（3.6 /docs） ----------
        location ~ ^/(docs|redoc|openapi.json) {
            proxy_pass         http://ai_career_backend;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }
    }

    # ---------- HTTPS（14.4）：拿到证书后解开 ----------
    # server {
    #     listen       443 ssl;
    #     http2        on;
    #     server_name  your-domain.com;
    #
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #     ssl_session_cache   shared:SSL:10m;
    #
    #     root /usr/share/nginx/html;
    #     index index.html;
    #
    #     location / { try_files $uri $uri/ /index.html; }
    #
    #     # 简历文件同样不配静态 location（见上面 HTTP server 里的说明）：
    #     # 文件只能走 /api/v1/resume/{id}/file（带鉴权）
    #
    #     location ~ ^/api/v1/chat/conversations/[^/]+/stream(/|$) {
    #         proxy_pass http://ai_career_backend;
    #         proxy_http_version 1.1;
    #         proxy_set_header Host $host;
    #         proxy_set_header Connection "";
    #         proxy_buffering off;
    #         proxy_request_buffering off;
    #         proxy_read_timeout 300s;
    #         add_header X-Accel-Buffering no;
    #     }
    #
    #     location /api/ {
    #         proxy_pass http://ai_career_backend;
    #         proxy_http_version 1.1;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto $scheme;
    #         proxy_intercept_errors off;   # 保留上游 4xx/5xx
    #     }
    # }
}
